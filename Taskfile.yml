version: '3'

# tartan-dictionary is a derived BUILD WORKSPACE + deploy target, not a source repo. It is
# assembled by the engine in ../tartan-weaver (the complete builder): `task site:sync` overlays
# the authored site, `task dictionary:build` generates the rest, and `task dia` does the full
# clean rebuild (including resetting this workspace via `go run ./cmd/siterepo clean`). This
# Taskfile keeps only the local Hugo build/preview tasks for this assembled tree.

tasks:
  default:
    desc: List available tasks
    cmd: task --list-all
    silent: true

  serve:
    desc: |
      Run the Hugo dev server (live reload). HEAVY — holds the full ~28k-page graph
      resident in memory (~10GB). Best for layout/template work where you need live
      template reload. For content/data work use `task preview` (caddy, ~30MB).
    cmd: hugo serve --bind 0.0.0.0

  preview:build:
    desc: Build public/ for LOCAL preview (localhost baseURL). Used by `task preview`.
    cmd: hugo --minify --baseURL "http://localhost:1313/"

  preview:
    desc: |
      Lightweight local preview: build the site once, then serve public/ with caddy
      (~30MB) instead of `task serve`'s in-memory Hugo server (~10GB on this 28k-page
      site). Caddy is a plain static file server — the build spikes briefly then exits,
      releasing all memory. Use for content/data work.
      To refresh after edits, re-run `task preview:build` in another terminal; caddy
      keeps serving and picks up the new files live. Serves on http://localhost:1313/.
    deps: [preview:build]
    cmd: caddy file-server --root public --listen :1313

  build:
    desc: Build the site for production
    cmd: hugo --minify

  test:
    desc: Build smoke test (fails on template/render errors)
    cmd: hugo --gc --minify

  check:
    desc: Run all checks (currently the build smoke test)
    cmds:
      - task: test

  # The full-reset (`clean`) and ownership audit (`ownership:check`) moved into the builder:
  # run `go run ./cmd/siterepo clean` / `go run ./cmd/siterepo check` from ../tartan-weaver.

  clean:public:
    desc: Remove just the built site (public/) — the Hugo output, not the source
    cmd: rm -rf public

  rebuild:
    desc: Remove the built site, then rebuild it (source content must already be present)
    deps: [clean:public]
    cmds:
      - hugo --minify
