version: '3'

tasks:
  default:
    desc: List available tasks
    cmd: task --list-all
    silent: true

  serve:
    desc: Run Hugo development server
    cmd: hugo serve --bind 0.0.0.0

  build:
    desc: Build the site for production
    cmd: hugo --minify

  test:
    desc: Build smoke test (fails on template/render errors)
    cmd: hugo --gc --minify

  check:
    desc: Run all checks (currently the build smoke test)
    cmds:
      - task: test

  clean:
    desc: |
      Reset this build workspace to its owned skeleton — delete everything the template
      sync + weaver generate re-supply (all generated content AND template-authored files).
      Only the workspace-owned files survive (the `owned` + `preserved` sets in ownership.yaml).
      Repopulate with:  cd ../tartan-dictionary-template && task generate
    prompt: Delete ALL generated + template-synced files, leaving only the workspace-owned skeleton?
    cmd: go run repo.go clean

  ownership:check:
    desc: |
      Validate the ownership contract (ownership.yaml) and audit the sibling template's
      `task sync` against it — fails if any owned/preserved/generated/build_artifact path
      is not excluded by the sync (i.e. would be clobbered or --delete'd on overlay).
    cmd: go run repo.go check

  clean:public:
    desc: Remove just the built site (public/) — the Hugo output, not the source
    cmd: rm -rf public

  rebuild:
    desc: Remove the built site, then rebuild it (source content must already be present)
    deps: [clean:public]
    cmds:
      - hugo --minify
