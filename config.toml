baseURL = "https://www.tartandictionary.org/"
locale = "en"
DefaultContentLanguage = "en"
theme = "TartanDictionary"
title = "Tartan Dictionary"
enableInlineShortcodes = true
enableEmoji = true
googleAnalytics = ""

# Keep table headers below the top-level scalars: anything after a [table] line belongs to that
# table, which once silently swallowed title & co into [pagination].
[pagination]
pagerSize = 20

[params]
  lazyImage = true
  enableMathJax = false # enable it in Front Matter
  enableReadingTime = true
  favicon = "/favicon.png" # the six-colour Dictionary sett, woven by tartan-weaver's `task site:assets`
  startyear = "2022"
  description = "A simple and concise hugo theme."
  disqus = ""

[params.valine]
  enable = false
  lang = 'en' 
  appId = ''
  appKey = ''
  placeholder = 'Say Something......'
  requiredFields = ['nick', 'mail']
  avatar = 'robohash'
  visitor = true
  serverURLS = 'https://abc123.api.lncldglobal.com'
  debug = false # display the visitor counts when using 'hugo server'

[menu]
  # No "Home" entry — the Tartan Dictionary wordmark/logo is the home link.
  # "Clan" groups the named-after-something tartans. The label is loose Scottish
  # flavour — the children are Family / Clans / Corporate / Other, not only clans.
  [[menu.main]]
  name = "Clan"
  identifier = "clan"
  url = "#"
  weight = 1
    [[menu.main]]
    parent = "clan"
    name = "Family"
    url = "/families/"
    weight = 1
    [[menu.main]]
    parent = "clan"
    name = "Clans"
    url = "/clan/"
    weight = 2
    # Groups — the generalised owner tier (#134): the dictionary's owners beyond the Scottish clans
    # (ancient finds, districts, organisations), each a typed group that may nest under a super-group.
    [[menu.main]]
    parent = "clan"
    name = "Groups"
    url = "/groups/"
    weight = 3
    [[menu.main]]
    parent = "clan"
    name = "Corporate"
    url = "/type/corporate/"
    weight = 4
    [[menu.main]]
    parent = "clan"
    name = "Other"
    url = "/type/other/"
    weight = 5

  # "Tartans" groups the structure-based views of the cloth itself.
  # Setts stays out of the menu (the name search and TTD navigator usurped its listing);
  # /setts/ remains as every variant's address space.
  [[menu.main]]
  name = "Tartans"
  identifier = "tartans"
  url = "#"
  weight = 2
    [[menu.main]]
    parent = "tartans"
    name = "Stripes"
    url = "/stripes/"
    weight = 1
    # Overstripes — "coming soon" holding page (layout: holding) until the real
    # content is built. See content/overstripes/.
    [[menu.main]]
    parent = "tartans"
    name = "Overstripes"
    url = "/overstripes/"
    weight = 2
    # Setts — the /setts/<bare-sett>/ tier: proportions recorded at more than one scale,
    # each gathering its setts. Generated by internal/dictionary writeTartans.
    # No "Setts" menu entry (#166): the sett A–Z duplicated the tartans A–Z once every named
    # tartan had its own page; sett pages are reached from their tartan's page.
    # Named tartans — the /tartans/<l>/<ll>/<name>/ tier (#69b, #166): one page per named design,
    # grouping its setts (kilt, Carpet, Child's…). Generated by GenerateTartans.
    [[menu.main]]
    parent = "tartans"
    name = "Named tartans"
    url = "/tartans/"
    weight = 4
    # Match a tartan to a logo or brand colours — the in-browser matcher at /logo/.
    [[menu.main]]
    parent = "tartans"
    name = "Match a logo"
    url = "/logo/"
    weight = 5

  # TTD (the tartan navigator) is its own top-level entry.
  [[menu.main]]
  name = "TTD"
  url = "/ttd/"
  weight = 3

  # Editorial blog (was "Posts"), sits to the right of TTD.
  [[menu.main]]
  name = "Blog"
  url = "/posts/"
  weight = 4

