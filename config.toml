baseURL = "https://www.tartandictionary.org/"
locale = "en"
DefaultContentLanguage = "en"
theme = "simpleness"
title = "Tartan Dictionary"
enableInlineShortcodes = true
enableEmoji = true
googleAnalytics = ""

# Keep table headers below the top-level scalars: anything after a [table] line belongs to that
# table, which once silently swallowed title & co into [pagination].
[pagination]
pagerSize = 20

[params]
  lazyImage = true
  enableMathJax = false # enable it in Front Matter
  enableReadingTime = true
  favicon = "favicon.ico"
  startyear = "2022"
  description = "A simple and concise hugo theme."
  disqus = ""

[params.valine]
  enable = false
  lang = 'en' 
  appId = ''
  appKey = ''
  placeholder = 'Say Something......'
  requiredFields = ['nick', 'mail']
  avatar = 'robohash'
  visitor = true
  serverURLS = 'https://abc123.api.lncldglobal.com'
  debug = false # display the visitor counts when using 'hugo server'

[menu]
  [[menu.main]]
  name = "Home"
  url = "/"
  weight = 1
  [[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 2
  [[menu.main]]
  name = "Clans"
  url = "/clan/"
  weight = 3
  [[menu.main]]
  name = "Stripe"
  url = "/stripe/"
  weight = 4
  [[menu.main]]
  name = "Pattern"
  url = "/pattern/"
  weight = 5
  [[menu.main]]
  name = "Setts"
  url = "/setts/"
  weight = 6
  [[menu.main]]
  name = "About"
  url = "/about/"
  weight = 8

[params.social]
  github = "https://github.com/Drummonds"
  rss = "index.xml"

[taxonomies]
category = "categories"
tag = "tags"
tartan = "tartans"
stripe = "stripes"

# doc: https://gohugo.io/getting-started/configuration-markup#highlight
# syntax style: https://xyproto.github.io/splash/docs/longer/all.html
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.typographer]
      disable = true
  [markup.highlight]
    guessSyntax = true
    hl_Lines = ""
    # lineNoStart = 1
    # lineNos = true
    # lineNumbersInTable = true
    noClasses = true
    style = "monokai" # github, dracula, vim, monokai
    tabWidth = 4

    