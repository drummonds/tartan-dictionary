baseURL = "https://www.tartandictionary.org/"
locale = "en"
DefaultContentLanguage = "en"
theme = "TartanDictionary"
title = "Tartan Dictionary"
enableInlineShortcodes = true
enableEmoji = true
googleAnalytics = ""

# Keep table headers below the top-level scalars: anything after a [table] line belongs to that
# table, which once silently swallowed title & co into [pagination].
[pagination]
pagerSize = 20

[params]
  lazyImage = true
  enableMathJax = false # enable it in Front Matter
  enableReadingTime = true
  favicon = "/favicon.png" # the six-colour Dictionary sett, woven by tartan-weaver's `task site:assets`
  startyear = "2022"
  description = "A simple and concise hugo theme."
  disqus = ""

[params.valine]
  enable = false
  lang = 'en' 
  appId = ''
  appKey = ''
  placeholder = 'Say Something......'
  requiredFields = ['nick', 'mail']
  avatar = 'robohash'
  visitor = true
  serverURLS = 'https://abc123.api.lncldglobal.com'
  debug = false # display the visitor counts when using 'hugo server'

[menu]
  # No "Home" entry — the Tartan Dictionary wordmark/logo is the home link.
  # "Clan" groups the named-after-something tartans. The label is loose Scottish
  # flavour — the children are Family / Clans / Corporate / Other, not only clans.
  [[menu.main]]
  name = "Clan"
  identifier = "clan"
  url = "#"
  weight = 1
    [[menu.main]]
    parent = "clan"
    name = "Family"
    url = "/families/"
    weight = 1
    [[menu.main]]
    parent = "clan"
    name = "Clans"
    url = "/clan/"
    weight = 2
    [[menu.main]]
    parent = "clan"
    name = "Corporate"
    url = "/type/corporate/"
    weight = 3
    [[menu.main]]
    parent = "clan"
    name = "Other"
    url = "/type/other/"
    weight = 4

  # "Tartans" groups the structure-based views of the cloth itself.
  # Setts stays out of the menu (the name search and TTD navigator usurped its listing);
  # /setts/ remains as every variant's address space.
  [[menu.main]]
  name = "Tartans"
  identifier = "tartans"
  url = "#"
  weight = 2
    [[menu.main]]
    parent = "tartans"
    name = "Stripe"
    url = "/stripe/"
    weight = 1
    [[menu.main]]
    parent = "tartans"
    name = "Pattern"
    url = "/pattern/"
    weight = 2

  # TTD (the tartan navigator) is its own top-level entry.
  [[menu.main]]
  name = "TTD"
  url = "/ttd/"
  weight = 3

  # Editorial blog (was "Posts"), sits to the right of TTD.
  [[menu.main]]
  name = "Blog"
  url = "/posts/"
  weight = 4

# Right-hand "Info" menu — rendered in nav-right, beside the social icons.
[[menu.info]]
name = "Info"
identifier = "info"
url = "#"
weight = 1
  [[menu.info]]
  parent = "info"
  name = "Colour"
  url = "/colour/"
  weight = 1
  [[menu.info]]
  parent = "info"
  name = "About"
  url = "/about/"
  weight = 2

[params.social]
  github = "https://github.com/Drummonds"
  rss = "index.xml"

[taxonomies]
category = "categories"
tag = "tags"
tartan = "tartans"
stripe = "stripes"

# doc: https://gohugo.io/getting-started/configuration-markup#highlight
# syntax style: https://xyproto.github.io/splash/docs/longer/all.html
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.typographer]
      disable = true
  [markup.highlight]
    guessSyntax = true
    hl_Lines = ""
    # lineNoStart = 1
    # lineNos = true
    # lineNumbersInTable = true
    noClasses = true
    style = "monokai" # github, dracula, vim, monokai
    tabWidth = 4

    