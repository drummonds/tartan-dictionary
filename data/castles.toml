# The River Tay — the spine of the Drummond country. Ordered NW -> SE to the firth.
[[river]]
name   = "Tay"
points = [[56.530, -4.200], [56.565, -3.600], [56.397, -3.430], [56.350, -3.230], [56.450, -3.020]]
