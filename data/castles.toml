# Castles of Clan Drummond — valid-time tenure data for the clan map.
#
# These are real-world FACTS only; the `castlemap` shortcode projects lat/lon to
# the SVG and decides styling. `held` is a list of [from, to] tenure intervals
# (to = 0 means "to the present"); a forfeiture-and-restoration is two intervals.
# `line`  = chiefly | cadet  (which Drummond line the seat belongs to).
# `rank`  = 1 principal seat of its line · 2 secondary.
#
# Dates are APPROXIMATE and pending a sourced verification pass — see the post.

[[castle]]
id       = "stobhall"
name     = "Stobhall"
line     = "chiefly"
rank     = 1
lat      = 56.500
lon      = -3.400
built    = 1360
held     = [[1360, 1745], [1785, 0]]
note     = "Early principal seat on the Tay; forfeited with the Perth estates after the '45, restored 1785. Today the seat of the Earl of Perth."

[[castle]]
id       = "drummond"
name     = "Drummond Castle"
line     = "chiefly"
rank     = 1
lat      = 56.325
lon      = -3.930
built    = 1490
held     = [[1490, 1745], [1785, 0]]
note     = "Built c.1490 by John, 1st Lord Drummond; seat of the Lords Drummond and Earls of Perth. Slighted after the '45; estates restored 1785."

[[castle]]
id       = "megginch"
name     = "Megginch Castle"
line     = "cadet"
rank     = 1
lat      = 56.395
lon      = -3.180
built    = 1460
held     = [[1664, 0]]
note     = "15th-century tower in the Carse of Gowrie; acquired by Robert Drummond in 1664. Seat of the Drummonds of Megginch to the present day."

# Castles a Drummond BUILT or briefly held but never kept — no lasting
# "Drummond of —" family came of them. Recorded as facts and for the eventual
# all-Scotland view; the `castlemap` shortcode ranges over [[castle]] only, so
# these are deliberately excluded from the Perthshire map.
[[former]]
id    = "balmoral"
name  = "Balmoral Castle"
lat   = 57.040
lon   = -3.230
built = 1390
held  = [[1390, 1450]]
note  = "First house built by Sir William Drummond in 1390; passed to the Gordons by the mid-15th century, then the Farquharsons and the Earl Fife, and bought by Prince Albert in 1852. A castle a Drummond built but never held — no Drummond of Balmoral family. (Aberdeenshire, ~80 miles from the Perthshire seats.)"

# Reference places — always drawn, faint, for orientation.
