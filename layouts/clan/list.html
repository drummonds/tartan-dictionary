{{/* Clan-tier branch pages (/clan/ and /clan/<slug>/) carry their whole body in generated
     content — families are linked explicitly — so render .Content like a single page instead of
     the date-grouped archive in _default/list.html. */}}
{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1 style="text-align: center;">{{ .Title }}</h1>
  </header>
  <div class="post-text">
    {{ .Content }}
  </div>
</article>
{{ end }}
