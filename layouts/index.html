{{ define "main" }}
    <main aria-role="main">
      <header class="homepage-header">
        <h1 class="visually-hidden">{{.Title}} — a journey to Scotland</h1>
        <img class="journey-map" src="/img/tartan-journey-map.svg"
             alt="A map of the lands north of the Roman empire tracing tartan's journey west to Scotland: from the domestication of sheep in Mesopotamia (c. 8000 BCE) and the Hami fragment of the Tarim (c. 1200 BCE), west along the Tartan Silk Road to Hallstatt (the La Tène check, c. 700 BCE) and the Gerum cloak in Sweden (c. 300 BCE), and on to Scotland — the Oakbank Crannog on Loch Tay (500 BCE), Vindolanda (c. CE 100) and Falkirk (the Falkirk check, c. CE 260).">
      </header>
      <div class="homepage-content">
        <!-- Note that the content for index.html, as a sort of list page, will pull from content/_index.md -->
        {{.Content}}
      </div>
      <div>
        {{ range first 10 .Site.RegularPages }}
            {{ .Render "summary"}}
        {{ end }}
      </div>
    </main>
{{ end }}
