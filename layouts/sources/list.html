{{/* Sources landing page (#31): render the generated intro + sources table (the default list
     layout groups child pages by date and ignores .Content — the ugly archive this replaces).
     Modelled on colourdict/list.html. */}}
{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1 style="text-align: center;">{{ .Title }}</h1>
  </header>
  <div class="post-text">
    {{ .Content }}
  </div>
</article>
{{ end }}
