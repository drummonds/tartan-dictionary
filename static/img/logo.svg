<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" role="img"
     aria-label="Tartan Dictionary">
  <title>Tartan Dictionary</title>

  <!-- ===== Tartan swatch mark =====
       A small woven sett: a green/navy ground crossed by black and a thin
       gold over-check. Horizontal bands are semi-transparent so the warp/weft
       crossings darken, which is what reads as "tartan". -->
  <defs>
    <clipPath id="swatch">
      <rect x="8" y="8" width="64" height="64" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#swatch)">
    <!-- ground -->
    <rect x="8" y="8" width="64" height="64" fill="#2f5d3f"/>

    <!-- vertical bands -->
    <g>
      <rect x="20" y="8" width="12" height="64" fill="#23456b" opacity=".9"/>
      <rect x="50" y="8" width="12" height="64" fill="#23456b" opacity=".9"/>
      <rect x="38" y="8" width="6"  height="64" fill="#11161c" opacity=".85"/>
      <rect x="14" y="8" width="2"  height="64" fill="#d9b441" opacity=".9"/>
      <rect x="66" y="8" width="2"  height="64" fill="#d9b441" opacity=".9"/>
    </g>

    <!-- horizontal bands (translucent → crossings read as weave) -->
    <g opacity=".55">
      <rect x="8" y="20" width="64" height="12" fill="#23456b"/>
      <rect x="8" y="50" width="64" height="12" fill="#23456b"/>
      <rect x="8" y="38" width="64" height="6"  fill="#11161c"/>
      <rect x="8" y="14" width="64" height="2"  fill="#d9b441"/>
      <rect x="8" y="66" width="64" height="2"  fill="#d9b441"/>
    </g>
  </g>
  <rect x="8" y="8" width="64" height="64" rx="10" fill="none"
        stroke="#11161c" stroke-opacity=".35" stroke-width="1.5"/>

  <!-- ===== Wordmark =====
       Uses the site "Motto" face when present, falling back to a serif. -->
  <text x="86" y="40" font-family="Motto, 'Brush Script MT', Georgia, serif"
        font-size="30" fill="#1d2733">Tartan</text>
  <text x="86" y="66" font-family="Georgia, 'Times New Roman', serif"
        font-size="20" letter-spacing="2.5" fill="#2f5d3f">DICTIONARY</text>
</svg>
